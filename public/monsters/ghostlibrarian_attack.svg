<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glBody" cx="40%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#cfd8f0" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#8a9ac0" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="glGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eef4ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#eef4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glBook" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f2e8c9"/>
      <stop offset="100%" stop-color="#a89860"/>
    </linearGradient>
    <radialGradient id="glShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#1a2440" flood-opacity="0.35"/>
    </filter>
  </defs>

  <ellipse cx="250" cy="430" rx="110" ry="18" fill="url(#glShadow)"/>

  <g filter="url(#glSoft)">
    <path d="M250 410 C185 410 160 355 175 300 C188 258 165 220 185 178
             C205 142 225 128 250 130 C275 126 305 145 320 180
             C338 220 315 258 328 300 C343 355 315 410 250 410 Z" fill="url(#glBody)"/>

    <path d="M180 190 C180 158 220 128 250 128 C280 128 320 158 320 190
             C320 222 288 245 250 245 C212 245 180 222 180 190 Z" fill="url(#glBody)"/>

    <!-- spectacles -->
    <circle cx="222" cy="192" r="16" fill="none" stroke="#5a6a8a" stroke-width="3" opacity="0.8"/>
    <circle cx="278" cy="192" r="16" fill="none" stroke="#5a6a8a" stroke-width="3" opacity="0.8"/>
    <line x1="238" y1="192" x2="262" y2="192" stroke="#5a6a8a" stroke-width="3" opacity="0.8"/>

    <path d="M212 190 L228 195 L212 200 Z" fill="#1a2440"/>
    <path d="M288 190 L272 195 L288 200 Z" fill="#1a2440"/>
    <ellipse cx="218" cy="194" rx="3" ry="3.5" fill="#dfe8ff">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.1s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="282" cy="194" rx="3" ry="3.5" fill="#dfe8ff">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.1s" repeatCount="indefinite"/>
    </ellipse>

    <path d="M230 218 Q250 226 270 218" stroke="#4a5a7a" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- hair bun -->
    <circle cx="250" cy="145" r="18" fill="url(#glBody)"/>

    <!-- arms holding an open floating book -->
    <path d="M195 260 C175 275 160 298 152 325 L170 332 C178 308 190 288 205 272 Z" fill="url(#glBody)"/>
    <path d="M305 260 C325 275 340 298 348 325 L330 332 C322 308 310 288 295 272 Z" fill="url(#glBody)"/>
  </g>

  <g transform="translate(250,345)">
    <animateTransform attributeName="transform" type="translate" values="250,340;250,350;250,340" dur="1.8s" repeatCount="indefinite" additive="sum"/>
    <path d="M-55 -5 L0 -18 L55 -5 L55 25 L0 12 L-55 25 Z" fill="url(#glBook)"/>
    <line x1="0" y1="-18" x2="0" y2="12" stroke="#8a7a50" stroke-width="2"/>
  </g>

  <circle cx="130" cy="200" r="4" fill="#cfd8f0" opacity="0.7">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="1.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="370" cy="180" r="3" fill="#cfd8f0" opacity="0.6">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="1.6s" repeatCount="indefinite"/>
  </circle>
</svg>
