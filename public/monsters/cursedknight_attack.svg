<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ckArmor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a3a3a"/>
      <stop offset="50%" stop-color="#241a1a"/>
      <stop offset="100%" stop-color="#0a0606"/>
    </linearGradient>
    <linearGradient id="ckTrim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c94040"/>
      <stop offset="100%" stop-color="#5a1010"/>
    </linearGradient>
    <radialGradient id="ckGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3a3a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff3a3a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ckShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="ckSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#050202" flood-opacity="0.55"/>
    </filter>
  </defs>

  <ellipse cx="250" cy="450" rx="130" ry="22" fill="url(#ckShadow)"/>

  <g filter="url(#ckSoft)">
    <path d="M210 355 C198 390 195 420 205 450 L238 450 C233 420 236 388 245 358 Z" fill="url(#ckArmor)"/>
    <path d="M285 358 C298 392 305 420 296 450 L262 450 C258 420 262 390 268 360 Z" fill="url(#ckArmor)"/>

    <!-- tattered cape -->
    <path d="M180 240 C155 290 150 350 165 410 L200 405 C190 355 195 300 210 250 Z" fill="url(#ckTrim)" opacity="0.75"/>

    <path d="M205 240 C195 275 200 310 220 335 C245 355 285 355 305 330
             C322 305 320 270 305 240 C280 218 235 216 205 240 Z" fill="url(#ckArmor)"/>
    <path d="M215 250 L295 245 L300 275 L210 282 Z" fill="url(#ckTrim)" opacity="0.7"/>

    <ellipse cx="230" cy="245" rx="24" ry="18" fill="url(#ckArmor)" transform="rotate(-15 230 245)"/>
    <ellipse cx="280" cy="245" rx="24" ry="18" fill="url(#ckArmor)" transform="rotate(15 280 245)"/>

    <!-- horned closed helm -->
    <path d="M215 150 C218 120 282 120 285 150 C288 190 265 215 250 215
             C235 215 212 190 215 150 Z" fill="url(#ckArmor)"/>
    <path d="M215 145 L195 100 L222 140 Z" fill="url(#ckArmor)"/>
    <path d="M285 145 L305 100 L278 140 Z" fill="url(#ckArmor)"/>
    <path d="M225 175 L235 195 L245 175 Z" fill="url(#ckGlow)"/>
    <path d="M255 175 L265 195 L275 175 Z" fill="url(#ckGlow)"/>

    <path d="M295 260 C320 245 340 225 355 200 L378 210 C365 238 342 262 312 280 Z" fill="url(#ckArmor)"/>
  </g>

  <g transform="translate(385,145) rotate(30)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-8;8;-8" dur="0.5s" repeatCount="indefinite"/>
      <rect x="-9" y="0" width="18" height="34" rx="3" fill="#0a0606"/>
      <rect x="-18" y="-6" width="36" height="12" rx="3" fill="url(#ckTrim)"/>
      <path d="M-10 0 L10 0 L5 -155 L-5 -155 Z" fill="url(#ckArmor)"/>
      <path d="M-2 -8 L2 -8 L1 -145 L-1 -145 Z" fill="#c94040" opacity="0.7"/>
    </g>
  </g>
</svg>
