<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="amSkin" cx="35%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#e8d0c0"/>
      <stop offset="60%" stop-color="#c9a488"/>
      <stop offset="100%" stop-color="#7a5540"/>
    </radialGradient>
    <linearGradient id="amRobe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a3a8a"/>
      <stop offset="60%" stop-color="#2b1d55"/>
      <stop offset="100%" stop-color="#150c30"/>
    </linearGradient>
    <linearGradient id="amGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe9a0"/>
      <stop offset="100%" stop-color="#c9a020"/>
    </linearGradient>
    <radialGradient id="amGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b8a0ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#b8a0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="amSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0a0518" flood-opacity="0.5"/>
    </filter>
  </defs>

  <ellipse cx="250" cy="450" rx="130" ry="22" fill="url(#amShadow)"/>

  <g filter="url(#amSoft)">
    <path d="M195 260 C175 310 172 370 195 430 L305 430 C328 370 325 310 305 260
             C270 232 230 232 195 260 Z" fill="url(#amRobe)"/>
    <path d="M210 275 L290 270 L294 300 L208 305 Z" fill="url(#amGold)" opacity="0.85"/>

    <ellipse cx="250" cy="255" rx="70" ry="24" fill="url(#amGold)"/>

    <path d="M218 190 C220 160 280 160 282 190 C285 222 262 245 250 245
             C238 245 215 220 218 190 Z" fill="url(#amSkin)"/>

    <!-- pointed hat + crown circlet -->
    <path d="M175 165 C190 145 310 145 325 165 C322 172 178 172 175 165 Z" fill="url(#amGold)"/>
    <path d="M180 165 L250 20 L260 165 Z" fill="url(#amRobe)"/>
    <path d="M180 165 L250 20 L245 22 L178 163 Z" fill="url(#amGold)" opacity="0.4"/>

    <path d="M222 205 L245 213 L222 221 Z" fill="#3a2a10"/>
    <path d="M278 205 L255 213 L278 221 Z" fill="#3a2a10"/>
    <ellipse cx="230" cy="212" rx="3.5" ry="4" fill="#b8a0ff">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="270" cy="212" rx="3.5" ry="4" fill="#b8a0ff">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1s" repeatCount="indefinite"/>
    </ellipse>

    <path d="M195 225 C200 245 210 260 220 262 C230 260 240 245 245 225
             C238 238 228 244 220 244 C212 244 202 238 195 225 Z" fill="#e8e4f0"/>

    <path d="M300 275 C325 262 345 240 358 212 L382 222 C367 252 344 275 315 295 Z" fill="url(#amSkin)"/>
  </g>

  <g transform="translate(388,190)">
    <circle r="34" fill="url(#amGlow)">
      <animate attributeName="r" values="26;40;26" dur="0.7s" repeatCount="indefinite"/>
    </circle>
    <circle r="14" fill="#e8ddff"/>
    <circle r="14" fill="none" stroke="url(#amGold)" stroke-width="3"/>
  </g>
</svg>
