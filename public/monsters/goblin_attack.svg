<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="gSkin" cx="35%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#c8ec7a"/>
      <stop offset="45%" stop-color="#8fc23f"/>
      <stop offset="100%" stop-color="#568020"/>
    </radialGradient>
    <radialGradient id="gSkinDark" cx="35%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#a9d85e"/>
      <stop offset="50%" stop-color="#729f30"/>
      <stop offset="100%" stop-color="#3e5c15"/>
    </radialGradient>
    <linearGradient id="gLeather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9a6a3e"/>
      <stop offset="100%" stop-color="#5c3a1e"/>
    </linearGradient>
    <linearGradient id="gLeatherLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c99a5c"/>
      <stop offset="100%" stop-color="#8a5a30"/>
    </linearGradient>
    <linearGradient id="gMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8ecef"/>
      <stop offset="50%" stop-color="#a6adb5"/>
      <stop offset="100%" stop-color="#666e77"/>
    </linearGradient>
    <radialGradient id="gShield" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#a9773f"/>
      <stop offset="60%" stop-color="#7a5228"/>
      <stop offset="100%" stop-color="#4a3016"/>
    </radialGradient>
    <radialGradient id="gGem" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#c9fff0"/>
      <stop offset="45%" stop-color="#3fd6a8"/>
      <stop offset="100%" stop-color="#0f7a5c"/>
    </radialGradient>
    <radialGradient id="gShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="gsoft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#16250a" flood-opacity="0.4"/>
    </filter>
  </defs>

  <ellipse cx="250" cy="460" rx="130" ry="24" fill="url(#gShadow)"/>

  <g filter="url(#gsoft)">
    <!-- back leg -->
    <path d="M210 355 C198 390 195 420 205 450 L238 450 C233 420 236 388 245 358 Z" fill="url(#gSkinDark)"/>
    <path d="M203 448 L232 448 L235 460 L200 460 Z" fill="#3a2712"/>

    <!-- front leg, wide stance -->
    <path d="M285 358 C298 392 305 420 296 450 L262 450 C258 420 262 390 268 360 Z" fill="url(#gSkin)"/>
    <path d="M260 448 L292 448 L295 460 L257 460 Z" fill="#3a2712"/>

    <!-- shield (round, held to the side, back arm) -->
    <g transform="translate(370,290)">
      <circle r="70" fill="url(#gShield)"/>
      <circle r="70" fill="none" stroke="#3a2712" stroke-width="6"/>
      <circle r="52" fill="none" stroke="#5c3a1e" stroke-width="3" opacity="0.6"/>
      <circle r="16" fill="url(#gMetal)"/>
      <circle r="16" fill="none" stroke="#4a4f55" stroke-width="2"/>
      <path d="M-70 0 A70 70 0 0 1 -49 -49" fill="none" stroke="#c99a5c" stroke-width="3" opacity="0.5"/>
    </g>
    <!-- back arm holding shield strap -->
    <path d="M320 265 C335 250 350 245 365 250 C355 265 345 280 335 295 Z" fill="url(#gSkinDark)"/>

    <!-- torso -->
    <path d="M205 240 C195 275 200 310 220 335 C245 355 285 355 305 330
             C322 305 320 270 305 240 C280 218 235 216 205 240 Z" fill="url(#gSkin)"/>

    <!-- leather chest strap + belt -->
    <path d="M215 250 L295 245 L300 275 L210 282 Z" fill="url(#gLeather)"/>
    <path d="M212 300 L302 295 C300 315 295 328 285 335 L225 335 C215 325 212 313 212 300 Z" fill="url(#gLeather)"/>
    <path d="M220 305 L295 300 L293 318 L222 322 Z" fill="url(#gLeatherLight)" opacity="0.7"/>

    <!-- shoulder guard -->
    <ellipse cx="230" cy="245" rx="22" ry="16" fill="url(#gMetal)" transform="rotate(-15 230 245)"/>

    <!-- necklace with gem -->
    <path d="M225 258 Q255 275 285 258" stroke="#3a2712" stroke-width="4" fill="none"/>
    <circle cx="255" cy="278" r="11" fill="url(#gGem)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="255" cy="278" r="11" fill="none" stroke="#0a3d2c" stroke-width="1.5"/>

    <!-- head -->
    <path d="M225 145 C265 138 300 160 302 200 C303 235 278 262 245 262
             C210 260 188 232 190 197 C191 170 202 152 225 145 Z" fill="url(#gSkin)"/>

    <!-- ears, large & pointed -->
    <path d="M195 175 C160 158 135 162 122 180 C148 195 175 200 200 198 Z" fill="url(#gSkin)"/>
    <path d="M295 172 C325 152 352 155 368 172 C345 188 318 196 292 196 Z" fill="url(#gSkin)"/>
    <path d="M200 180 C178 170 162 172 152 182 C168 190 185 193 202 191 Z" fill="url(#gSkinDark)" opacity="0.6"/>

    <!-- brow -->
    <path d="M205 195 C218 186 235 184 248 190" stroke="#3e5c15" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M258 190 C270 184 284 186 293 195" stroke="#3e5c15" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- eyes, angry yellow -->
    <path d="M212 205 L238 213 L212 220 Z" fill="#1a1206"/>
    <path d="M283 205 L257 213 L283 220 Z" fill="#1a1206"/>
    <ellipse cx="221" cy="212" rx="3.5" ry="3.5" fill="#ffe14a">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="274" cy="212" rx="3.5" ry="3.5" fill="#ffe14a">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1s" repeatCount="indefinite"/>
    </ellipse>

    <!-- nose -->
    <path d="M240 220 C244 228 244 234 240 238 C248 240 256 238 258 232 C254 224 248 220 240 220 Z" fill="#3e5c15" opacity="0.5"/>

    <!-- snarling mouth with tusks -->
    <path d="M212 240 Q248 262 288 240 Q265 252 250 252 Q235 252 212 240 Z" fill="#1a2f08"/>
    <path d="M222 240 L228 252 L235 240 Z" fill="#f2efe0"/>
    <path d="M265 240 L272 252 L278 240 Z" fill="#f2efe0"/>
    <!-- lower tusks jutting up -->
    <path d="M228 246 L224 228 L236 244 Z" fill="#efe9d8"/>
    <path d="M272 246 L276 228 L264 244 Z" fill="#efe9d8"/>

    <!-- front arm raised, gripping sword hilt -->
    <path d="M295 260 C320 245 340 225 355 200 L378 210 C365 238 342 262 312 280 Z" fill="url(#gSkin)"/>
    <ellipse cx="365" cy="205" rx="14" ry="11" fill="url(#gMetal)" transform="rotate(-30 365 205)"/>
  </g>

  <!-- sword, raised diagonally, swinging -->
  <g transform="translate(378,130) rotate(35)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-7;7;-7" dur="0.5s" repeatCount="indefinite"/>
      <rect x="-8" y="0" width="16" height="34" rx="3" fill="#3a2712"/>
      <rect x="-16" y="-4" width="32" height="10" rx="3" fill="#5c3a1e"/>
      <path d="M-9 0 L9 0 L4 -160 L-4 -160 Z" fill="url(#gMetal)"/>
      <path d="M-2 -6 L2 -6 L1 -155 L-1 -155 Z" fill="#ffffff" opacity="0.6"/>

      <!-- impact burst at blade tip -->
      <g transform="translate(0,-165)">
        <path d="M0 -9 L3 -2.5 L10 -1 L4.5 4.5 L5.5 11 L0 7 L-5.5 11 L-4.5 4.5 L-10 -1 L-3 -2.5 Z" fill="#f2f2f2" opacity="0.85">
          <animateTransform attributeName="transform" type="scale" values="0.6;1.15;0.6" dur="0.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.5;0.95;0.5" dur="0.4s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>
  </g>
</svg>
