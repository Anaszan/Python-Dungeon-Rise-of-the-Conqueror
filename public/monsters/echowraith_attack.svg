<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="ewAura" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#3a6bd1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3a6bd1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ewBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f5aa0"/>
      <stop offset="45%" stop-color="#1a2c5c"/>
      <stop offset="100%" stop-color="#080f26"/>
    </linearGradient>
    <linearGradient id="ewCloak" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#233c73"/>
      <stop offset="100%" stop-color="#05081a"/>
    </linearGradient>
    <radialGradient id="ewEyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eaf6ff"/>
      <stop offset="40%" stop-color="#6fb0ff"/>
      <stop offset="100%" stop-color="#0f5fd9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ewRingGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bfe0ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#bfe0ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="ewGlowBlur"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="500" height="500" fill="none"/>
  <ellipse cx="250" cy="250" rx="220" ry="220" fill="url(#ewAura)">
    <animate attributeName="rx" values="200;225;200" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="200;225;200" dur="2s" repeatCount="indefinite"/>
  </ellipse>

  <!-- faint echo copy, offset back and up-left, low opacity, no detail -->
  <g opacity="0.28" transform="translate(-42,-30) scale(0.82)">
    <path d="M250 130 C300 140 328 190 320 235 C338 275 350 330 335 385
             C320 350 310 330 300 385 C285 345 278 330 268 385
             C255 345 245 330 235 385 C220 348 210 330 198 385
             C182 345 172 330 162 385 C142 340 155 275 182 235
             C168 190 205 140 250 130 Z" fill="#3a6bd1"/>
    <ellipse cx="228" cy="180" rx="11" ry="7" fill="#8fc9ff"/>
    <ellipse cx="272" cy="180" rx="11" ry="7" fill="#8fc9ff"/>
  </g>

  <!-- tattered cloak base -->
  <path d="M250 120
           C310 130 350 190 340 250
           C365 300 380 380 360 440
           C340 400 330 380 320 440
           C305 395 300 380 288 440
           C275 390 265 380 255 440
           C240 390 230 380 220 440
           C205 395 195 380 182 440
           C165 390 155 380 145 440
           C120 380 135 300 165 250
           C150 190 190 130 250 120 Z"
        fill="url(#ewCloak)"/>

  <!-- inner body silhouette -->
  <path d="M250 140 C295 150 320 195 312 240 C330 280 335 330 320 380
           C300 340 290 300 288 260 C280 220 260 200 250 200
           C240 200 220 220 212 260 C210 300 200 340 180 380
           C165 330 170 280 188 240 C180 195 205 150 250 140 Z"
        fill="url(#ewBody)" opacity="0.85"/>

  <!-- hood shadow -->
  <path d="M250 110 C300 115 330 160 322 205 C310 190 285 175 250 175
           C215 175 190 190 178 205 C170 160 200 115 250 110 Z" fill="#05081a"/>

  <!-- glowing eyes -->
  <ellipse cx="228" cy="175" rx="12" ry="8" fill="url(#ewEyeGlow)">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="1s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="272" cy="175" rx="12" ry="8" fill="url(#ewEyeGlow)">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="1s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="228" cy="175" rx="4" ry="4" fill="#ffffff"/>
  <ellipse cx="272" cy="175" rx="4" ry="4" fill="#ffffff"/>

  <!-- casting arm raised, releasing a sonic blast -->
  <path d="M320 260 C360 240 390 210 415 185 C405 205 395 230 385 250
           C400 245 415 235 428 220 C415 250 390 270 360 280 Z"
        fill="url(#ewCloak)"/>

  <!-- concentric sonic rings emanating from the hand -->
  <g transform="translate(430,195)">
    <circle r="14" fill="url(#ewRingGlow)" filter="url(#ewGlowBlur)">
      <animate attributeName="r" values="10;18;10" dur="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="30" fill="none" stroke="#bfe0ff" stroke-width="4" opacity="0.7">
      <animate attributeName="r" values="18;46;18" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;0;0.75" dur="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle r="30" fill="none" stroke="#8fc9ff" stroke-width="3" opacity="0.6">
      <animate attributeName="r" values="14;60;14" dur="1.1s" begin="0.35s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.65;0;0.65" dur="1.1s" begin="0.35s" repeatCount="indefinite"/>
    </circle>
    <circle r="30" fill="none" stroke="#3a6bd1" stroke-width="3" opacity="0.5">
      <animate attributeName="r" values="10;74;10" dur="1.1s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0;0.55" dur="1.1s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- impact burst at blast contact point -->
  <g transform="translate(476,158)">
    <path d="M0 -11 L3 -3 L12 -2 L5 5 L7 14 L0 8 L-7 14 L-5 5 L-12 -2 L-3 -3 Z" fill="#eaf6ff" opacity="0.85">
      <animateTransform attributeName="transform" type="scale" values="0.6;1.2;0.6" dur="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="0.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- wispy trailing energy from the other hand -->
  <path d="M180 300 C150 320 130 350 120 385" stroke="#3a6bd1" stroke-width="6" stroke-linecap="round" opacity="0.5" fill="none"/>
  <path d="M195 310 C170 335 155 360 148 390" stroke="#3a6bd1" stroke-width="4" stroke-linecap="round" opacity="0.35" fill="none"/>
</svg>
